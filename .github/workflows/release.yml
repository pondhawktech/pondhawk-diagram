name: Release

# Pushing a tag like v1.2.0 builds and tests that commit, publishes the packages to GitHub
# Packages, and attaches them to a GitHub Release. Nothing here touches nuget.org: that is the
# Promote workflow, run by hand once the release has been tried.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build, Test, and Pack
        # The tag is the version.
        run: dotnet run --project build -- --target=Pack --release-version="$TAG"

      - name: Push to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet run --project build --no-build --
          --target=Push
          --source="https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"

      - name: Create GitHub Release
        # The packages attached here are the ones Promote later sends to nuget.org.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --generate-notes
